<div style="font-family: sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px;">
    <h2>{{ titulo }}</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="background: #4a90e2; color: white; padding: 10px; border: none; width: 100%; border-radius: 5px;">Guardar</button>
    </form>
    <br>
    <a href="{% url 'buscar' %}">Volver atrás</a>
</div>
